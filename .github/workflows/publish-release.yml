name: Publish Full HD Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
      - 'docs/RELEASE_NOTES_v0.16.md'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.16)
        required: true
        default: v0.16

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Full HD NRO and four screenshots from the uploaded kit
        run: |
          set -euo pipefail
          KIT="release-assets/v0.16/NFS_Save_Lab_NX_v0.16_GitHub_Release_Kit.zip"
          test -s "$KIT" || {
            echo "Missing GitHub Release Kit ZIP in release-assets/v0.16."
            exit 1
          }
          mkdir -p docs/screenshots
          unzip -p "$KIT" "02_Upload_to_release-assets_v0.16/nfs_save_lab_nx.nro" \
            > "release-assets/v0.16/nfs_save_lab_nx.nro"
          for screenshot in \
            01-main-menu.jpg \
            02-most-wanted-save-list.jpg \
            03-underground-2-profiles.jpg \
            04-carbon-cash.jpg
          do
            unzip -p "$KIT" "01_Upload_to_docs_screenshots/$screenshot" \
              > "docs/screenshots/$screenshot"
          done
          test -s release-assets/v0.16/nfs_save_lab_nx.nro
          echo "Extracted tested NRO and four screenshots"

      - name: Verify tested Full HD NRO
        env:
          VERSION: ${{ inputs.version || 'v0.16' }}
        run: |
          set -euo pipefail
          test "$VERSION" = "v0.16" || { echo "This workflow is configured only for v0.16."; exit 1; }
          test -s release-assets/v0.16/nfs_save_lab_nx.nro || {
            echo "Missing the NRO in release-assets/v0.16/. Upload the FULL HD NRO first."
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("release-assets/v0.16/nfs_save_lab_nx.nro")
          b=p.read_bytes()
          assert b[16:20] == b"NRO0", "Invalid Nintendo Switch NRO"
          assert len(b)>800000, "NRO too small for the embedded HD artwork"
          magic,version,w,h,length=struct.unpack_from("<8sIHHI",b,len(b)-20)
          assert (magic,version,w,h,length)==(b"NFSLABP8",1,336,360,725760), "Full HD posters are missing"
          off=struct.unpack_from("<I",b,0x18)[0]
          aset,ver,io,il,no,nl,ro,rl=struct.unpack_from("<IIQQQQQQ",b,off)
          assert aset==0x54455341 and ver==0 and nl==16384, "Bad icon/NACP header"
          assert b[off+io:off+io+2]==bytes([0xff,0xd8]), "Custom JPEG Homebrew Menu icon missing"
          assert b"0.16.0" in b[off+no:off+no+nl] or b"0.16.0" in b, "Wrong app version"
          print("Verified full HD v0.16, app icon, all 3 posters:",len(b),"bytes")
          PY

      - name: Verify screenshot gallery
        run: |
          set -euo pipefail
          for screenshot in \
            docs/screenshots/01-main-menu.jpg \
            docs/screenshots/02-most-wanted-save-list.jpg \
            docs/screenshots/03-underground-2-profiles.jpg \
            docs/screenshots/04-carbon-cash.jpg
          do
            test -s "$screenshot" || { echo "Missing screenshot: $screenshot"; exit 1; }
          done

      - name: Package binaries and three-language release notes
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release-assets/v0.16/nfs_save_lab_nx.nro dist/nfs_save_lab_nx.nro
          (cd dist && zip -9 NFS_Save_Lab_NX_v0.16_Full_HD.zip nfs_save_lab_nx.nro)
          cp docs/RELEASE_NOTES_v0.16.md dist/release-notes.md

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'v0.16' }}
        run: |
          set -euo pipefail
          TITLE="NFS Save Lab NX ${VERSION} — Most Wanted / Underground 2 / Carbon"
          ASSETS=(
            dist/nfs_save_lab_nx.nro
            dist/NFS_Save_Lab_NX_v0.16_Full_HD.zip
            docs/screenshots/01-main-menu.jpg
            docs/screenshots/02-most-wanted-save-list.jpg
            docs/screenshots/03-underground-2-profiles.jpg
            docs/screenshots/04-carbon-cash.jpg
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$TITLE" --notes-file dist/release-notes.md --latest
            gh release upload "$VERSION" "${ASSETS[@]}" --clobber
          else
            gh release create "$VERSION" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" --title "$TITLE" \
              --notes-file dist/release-notes.md --latest
          fi
          gh release view "$VERSION" --json url --jq .url
